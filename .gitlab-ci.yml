stages:
  - install
  - lint
  - typecheck
  - test
  - build

variables:
  PNPM_VERSION: '9'

.node_job:
  image: node:20-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store

install:
  extends: .node_job
  stage: install
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - backend/node_modules/
      - frontend/node_modules/
    expire_in: 1 hour

lint:
  extends: .node_job
  stage: lint
  needs:
    - install
  script:
    - pnpm run lint

typecheck:
  extends: .node_job
  stage: typecheck
  needs:
    - install
  script:
    - pnpm run typecheck

test:
  extends: .node_job
  stage: test
  needs:
    - install
  script:
    - pnpm run test

build:
  extends: .node_job
  stage: build
  needs:
    - install
  script:
    - pnpm run build
