services:
  postgres:
    image: postgres:16-alpine
    container_name: fragstack-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: fragstack
      POSTGRES_PASSWORD: fragstack
      POSTGRES_DB: fragstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fragstack -d fragstack']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fragstack-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '1']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '1', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
